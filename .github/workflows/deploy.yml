name: Deploy KDM Executive Bots to Digital Ocean

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Log in to Docker Hub (or DigitalOcean Container Registry)
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3. Build and push Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/kdm-executive-bots:latest

      # 4. SSH into Digital Ocean Droplet and redeploy
      - name: Deploy to Digital Ocean Droplet
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            # Pull latest image
            docker pull ${{ secrets.DOCKER_USERNAME }}/kdm-executive-bots:latest

            # Stop and remove old container
            docker stop kdm-executive-bots || true
            docker rm kdm-executive-bots || true

            # Run new container with env vars from Droplet's .env file
            docker run -d \
              --name kdm-executive-bots \
              --restart unless-stopped \
              --env-file /root/kdm-executive-bots/.env \
              ${{ secrets.DOCKER_USERNAME }}/kdm-executive-bots:latest

            # Clean up old images
            docker image prune -f

            echo "✅ Deployment complete!"
