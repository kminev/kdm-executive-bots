name: Deploy KDM Bots to Digital Ocean

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/kdm-executive-bots:latest

      - name: Deploy to Digital Ocean Droplet
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/kdm-executive-bots:latest

            docker stop kdm-executive-bots || true
            docker rm kdm-executive-bots || true

            docker run -d \
              --name kdm-executive-bots \
              --restart unless-stopped \
              --env-file /root/kdm-executive-bots/.env \
              -v /root/kdm-executive-bots/gdrive-creds.json:/root/kdm-executive-bots/gdrive-creds.json:ro \
              ${{ secrets.DOCKER_USERNAME }}/kdm-executive-bots:latest

            docker image prune -f

            echo "✅ Deployment complete!"
